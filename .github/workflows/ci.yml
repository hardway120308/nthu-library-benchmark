name: CI Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Adjust to your target Python version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: "uv.lock"

      - name: Install project and dependencies
        run: |
          # Syncs your environment (creates venv and installs dev/lint dependencies)
          uv sync --all-extras --dev

      - name: Check code formatting (Ruff)
        run: |
          uv run ruff format --check .

      - name: Lint code and check for errors (Ruff)
        run: |
          uv run ruff check .

      - name: Type check and verify type hints (Mypy)
        run: |
          uv run mypy src/ # Replace 'src/' with your package or script directory